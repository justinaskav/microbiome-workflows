name: qiime2-amplicon
channels:
  - qiime2
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - qiime2=2025.4
  - q2cli
  - q2templates
  - q2-types
  - q2-feature-table
  - q2-feature-classifier
  - q2-alignment
  - q2-phylogeny
  - q2-diversity
  - q2-emperor
  - q2-taxa
  - q2-metadata
  - q2-demux
  - q2-deblur
  - q2-vsearch
  - q2-cutadapt
  - q2-dada2
  - multiqc
  - fastqc
  # Additional tools commonly used
  - bioconductor-dada2
  - bioconductor-biomformat